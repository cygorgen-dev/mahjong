<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Peek 👁</title>
  <script src="js/tiles.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #07301a; color: #ccc; padding: 8px; margin: 0; font-family: system-ui, sans-serif; }

    #stats {
      display: flex; gap: 14px; flex-wrap: wrap;
      padding: 5px 8px; margin-bottom: 8px;
      background: rgba(0,0,0,.4); border-radius: 6px;
      font-size: 12px; font-weight: 600;
    }

    /* 72 column-pair units, wrapped with a visible row gap */
    #seq {
      display: flex;
      flex-wrap: wrap;
      column-gap: 4px;
      row-gap: 12px;
      align-items: flex-start;
    }

    .pw-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      gap: 1px;
    }

    .pw-tile {
      display: block;
      width: 30px;
      height: 42px;
      object-fit: cover;
    }

    .pw-lbl {
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
      margin-top: 2px;
    }

    #no-signal { color: #555; padding: 30px; text-align: center; width: 100%; font-size: 13px; }
  </style>
</head>
<body>
  <div id="stats"></div>
  <div id="seq"><div id="no-signal">Waiting for game… click Peek Wall in the main window.</div></div>

  <script>
    function tileSrc(t) {
      return `img/tiles/${t.suit}_${t.value}.png`;
    }

    function makePeekTile(t) {
      const img = document.createElement('img');
      img.className = 'pw-tile';
      img.src = tileSrc(t);
      return img;
    }

    function render(data) {
      const wall      = data.wall;
      const wallIdx   = data.wallIdx;
      const tailCol   = data.tailCol;
      const tailPhase = data.tailPhase;
      const remain    = Math.max(0, 2 * (tailCol + 1) - wallIdx - tailPhase);
      const tailUsed  = (71 - tailCol) * 2 + tailPhase;

      document.getElementById('stats').innerHTML = `
        <span style="color:#7dffff">${remain} live</span>
        <span style="color:#aaa">${wallIdx} drawn</span>
        <span style="color:#aaa">${tailUsed} replaced</span>
        <span style="color:#ffd34d">▼ next draw</span>
        <span style="color:#ff9800">▲ next replacement</span>
        <span style="color:#555">dim = used</span>
      `;

      function isTailConsumed(i) {
        const c = Math.floor(i / 2);
        const isTop = (i % 2 === 0);
        if (c > tailCol) return true;
        if (c === tailCol && isTop && tailPhase === 1) return true;
        return false;
      }

      const nextHeadIdx = wallIdx;
      const nextTailIdx = tailCol * 2 + tailPhase;

      const seq = document.getElementById('seq');
      seq.innerHTML = '';

      for (let c = 0; c < 72; c++) {
        const topIdx = c * 2;
        const botIdx = c * 2 + 1;

        const colWrap = document.createElement('div');
        colWrap.className = 'pw-col';

        // top tile (even index)
        const topImg = makePeekTile(wall[topIdx]);
        if (topIdx === nextHeadIdx) {
          topImg.style.outline = '3px solid #ffd34d';
          topImg.style.boxShadow = '0 0 7px 2px rgba(255,211,77,0.6)';
        } else if (topIdx === nextTailIdx) {
          topImg.style.outline = '3px solid #ff9800';
          topImg.style.boxShadow = '0 0 7px 2px rgba(255,152,0,0.6)';
        } else if (topIdx < wallIdx) {
          topImg.style.opacity = '0.18';
        } else if (isTailConsumed(topIdx)) {
          topImg.style.opacity = '0.22';
          topImg.style.outline = '1px solid rgba(255,152,0,0.35)';
        }
        colWrap.appendChild(topImg);

        // bottom tile (odd index)
        const botImg = makePeekTile(wall[botIdx]);
        if (botIdx === nextHeadIdx) {
          botImg.style.outline = '3px solid #ffd34d';
          botImg.style.boxShadow = '0 0 7px 2px rgba(255,211,77,0.6)';
        } else if (botIdx === nextTailIdx) {
          botImg.style.outline = '3px solid #ff9800';
          botImg.style.boxShadow = '0 0 7px 2px rgba(255,152,0,0.6)';
        } else if (botIdx < wallIdx) {
          botImg.style.opacity = '0.18';
        } else if (isTailConsumed(botIdx)) {
          botImg.style.opacity = '0.22';
          botImg.style.outline = '1px solid rgba(255,152,0,0.35)';
        }
        colWrap.appendChild(botImg);

        // ▼ / ▲ label below column at the head or tail pointer
        const isHeadCol = c === Math.floor(nextHeadIdx / 2);
        const isTailColHere = c === tailCol;
        if (isHeadCol || isTailColHere) {
          const lbl = document.createElement('div');
          lbl.className = 'pw-lbl';
          if (isHeadCol && isTailColHere) {
            lbl.style.color = '#fff';
            lbl.textContent = '▼▲';
          } else if (isHeadCol) {
            lbl.style.color = '#ffd34d';
            lbl.textContent = '▼';
          } else {
            lbl.style.color = '#ff9800';
            lbl.textContent = '▲';
          }
          colWrap.appendChild(lbl);
        }

        seq.appendChild(colWrap);
      }
    }

    const bc = new BroadcastChannel('mahjong-wall');
    bc.onmessage = e => render(e.data);

    try {
      const saved = localStorage.getItem('mahjong-wall-state');
      if (saved) render(JSON.parse(saved));
    } catch(e) {}
  </script>
</body>
</html>
