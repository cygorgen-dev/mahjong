<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Peek 👁</title>
  <script src="js/tiles.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #07301a; color: #ccc; padding: 8px; margin: 0; font-family: system-ui, sans-serif; }

    #stats {
      display: flex; gap: 14px; flex-wrap: wrap;
      padding: 5px 8px; margin-bottom: 8px;
      background: rgba(0,0,0,.4); border-radius: 6px;
      font-size: 12px; font-weight: 600;
    }

    #seq {
      display: flex;
      flex-wrap: wrap;
      column-gap: 4px;
      row-gap: 12px;
      align-items: flex-start;
    }

    .pw-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      gap: 1px;
    }

    .pw-tile {
      display: block;
      width: 38px;
      height: 54px;
      object-fit: cover;
    }

    .pw-lbl {
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      margin-top: 2px;
      min-height: 11px;
    }

    #no-signal { color: #555; padding: 30px; text-align: center; width: 100%; font-size: 13px; }
  </style>
</head>
<body>
  <div id="stats"></div>
  <div id="seq"><div id="no-signal">Waiting for game… click Peek Wall in the main window.</div></div>

  <script>
    let _tileImgs = [];   // 144 persistent img elements, indexed by wall position
    let _lblEls   = [];   // 72 persistent label divs
    let _initWallId = null;

    function initGrid(wall) {
      const seq = document.getElementById('seq');
      seq.innerHTML = '';
      _tileImgs = [];
      _lblEls   = [];

      for (let c = 0; c < 72; c++) {
        const colWrap = document.createElement('div');
        colWrap.className = 'pw-col';

        for (const i of [c * 2, c * 2 + 1]) {
          const t = wall[i];
          const img = document.createElement('img');
          img.className = 'pw-tile';
          img.src = `img/tiles/${t.suit}_${t.value}.png`;
          _tileImgs[i] = img;
          colWrap.appendChild(img);
        }

        const lbl = document.createElement('div');
        lbl.className = 'pw-lbl';
        _lblEls[c] = lbl;
        colWrap.appendChild(lbl);
        seq.appendChild(colWrap);
      }

      _initWallId = wall[0].id;
    }

    function render(data) {
      const wall      = data.wall;
      const wallIdx   = data.wallIdx;
      const tailCol   = data.tailCol;
      const tailPhase = data.tailPhase;
      const remain    = Math.max(0, 2 * (tailCol + 1) - wallIdx - tailPhase);
      const tailUsed  = (71 - tailCol) * 2 + tailPhase;
      const exhausted = remain === 0;

      const headSkips = wallIdx % 2 === 0 && Math.floor(wallIdx / 2) === tailCol && tailPhase === 1;
      const effectiveHeadIdx = wallIdx + (headSkips ? 1 : 0);
      const effTailPhase = (tailPhase === 0 && tailCol * 2 < wallIdx) ? 1 : tailPhase;
      const effectiveTailIdx = tailCol * 2 + effTailPhase;
      const lastTile = !exhausted && effectiveHeadIdx === effectiveTailIdx;

      // Stats bar
      const statsEl = document.getElementById('stats');
      if (exhausted) {
        statsEl.innerHTML = `
          <span style="color:#ff4444;font-weight:700;font-size:13px;">🏁 WALL EXHAUSTED — 0 tiles left</span>
          <span style="color:#aaa">${wallIdx} drawn · ${tailUsed} replaced</span>
        `;
      } else if (lastTile) {
        statsEl.innerHTML = `
          <span style="color:#ff4444;font-weight:700">▼▲ LAST TILE — head &amp; tail meet</span>
          <span style="color:#7dffff">1 live</span>
          <span style="color:#aaa">${wallIdx} drawn · ${tailUsed} replaced</span>
          <span style="color:#555">dim = used</span>
        `;
      } else {
        statsEl.innerHTML = `
          <span style="color:#7dffff">${remain} live</span>
          <span style="color:#aaa">${wallIdx} drawn · ${tailUsed} replaced</span>
          <span style="color:#ffd34d">▼ next draw</span>
          <span style="color:#ff9800">▲ next replacement</span>
          <span style="color:#555">dim = used</span>
        `;
      }

      // Build grid once per game (detect new game by wall[0].id changing)
      if (_tileImgs.length === 0 || wall[0].id !== _initWallId) initGrid(wall);

      function isTailConsumed(i) {
        const c = Math.floor(i / 2);
        const isTop = (i % 2 === 0);
        if (c > tailCol) return true;
        if (c === tailCol && isTop && tailPhase === 1) return true;
        return false;
      }

      // Update styles in-place — never recreate img elements so there is no reload flash
      for (let c = 0; c < 72; c++) {
        for (const i of [c * 2, c * 2 + 1]) {
          const isHead     = !exhausted && i === effectiveHeadIdx;
          const isTail     = !exhausted && !lastTile && i === effectiveTailIdx;
          const isBoth     = !exhausted && lastTile && i === effectiveHeadIdx;
          const isHeadUsed = i < wallIdx;
          const isTailUsed = isTailConsumed(i);

          const img = _tileImgs[i];
          img.style.opacity    = '';
          img.style.outline    = '';
          img.style.boxShadow  = '';

          if (isBoth) {
            img.style.outline    = '3px solid #ff4444';
            img.style.boxShadow  = '0 0 8px 3px rgba(255,68,68,0.7)';
          } else if (isHead) {
            img.style.outline    = '3px solid #ffd34d';
            img.style.boxShadow  = '0 0 7px 2px rgba(255,211,77,0.6)';
          } else if (isTail) {
            img.style.outline    = '3px solid #ff9800';
            img.style.boxShadow  = '0 0 7px 2px rgba(255,152,0,0.6)';
          } else if (exhausted || isHeadUsed) {
            img.style.opacity    = '0.18';
          } else if (isTailUsed) {
            img.style.opacity    = '0.22';
            img.style.outline    = '1px solid rgba(255,152,0,0.35)';
          }
        }

        const isHeadCol  = !exhausted && c === Math.floor(effectiveHeadIdx / 2);
        const isTailColH = !exhausted && !lastTile && c === Math.floor(effectiveTailIdx / 2);
        const isBothCol  = !exhausted && lastTile && c === Math.floor(effectiveHeadIdx / 2);
        const lbl = _lblEls[c];
        if (isBothCol) {
          lbl.style.color = '#ff4444'; lbl.textContent = '▼▲';
        } else if (isHeadCol && isTailColH) {
          lbl.style.color = '#fff';    lbl.textContent = '▼▲';
        } else if (isHeadCol) {
          lbl.style.color = '#ffd34d'; lbl.textContent = '▼';
        } else if (isTailColH) {
          lbl.style.color = '#ff9800'; lbl.textContent = '▲';
        } else {
          lbl.textContent = '';
        }
      }

      // Prominent exhausted banner
      const oldBanner = document.getElementById('wall-exhausted-banner');
      if (oldBanner) oldBanner.remove();
      if (exhausted) {
        const banner = document.createElement('div');
        banner.id = 'wall-exhausted-banner';
        banner.style.cssText = 'margin-top:12px;padding:10px 18px;background:rgba(255,68,68,0.12);border:2px solid #ff4444;border-radius:8px;text-align:center;font-size:13px;font-weight:700;color:#ff8080;';
        banner.textContent = '🏁 Wall exhausted — no tiles remain. This hand ends in a draw (黃牌).';
        document.getElementById('seq').after(banner);
      }
    }

    const bc = new BroadcastChannel('mahjong-wall');
    bc.onmessage = e => render(e.data);

    try {
      const saved = localStorage.getItem('mahjong-wall-state');
      if (saved) render(JSON.parse(saved));
    } catch(e) {}
  </script>
</body>
</html>
